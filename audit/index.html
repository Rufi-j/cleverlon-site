  <style>
    :root {
      --paper: #EDEDE8;
      --card: #F7F7F4;
      --ink: #16181C;
      --muted: #6B7078;
      --rule: #C9CCD2;
      --accent: #2340C8;
      --signal: #B8860B;
      --display: "Archivo", system-ui, sans-serif;
      --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column
    }

    .shell {
      flex: 1;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 20px 20px 0;
      display: flex;
      flex-direction: column
    }

    /* masthead */
    .mast {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 14px
    }

    .mark {
      font-family: var(--display);
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -.03em
    }

    .mark span {
      color: var(--accent)
    }

    .count {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .08em
    }

    /* segmented progress — one segment per question */
    .prog {
      display: flex;
      gap: 3px;
      margin-bottom: 26px
    }

    .seg {
      flex: 1;
      height: 3px;
      background: var(--rule)
    }

    .seg.done {
      background: var(--accent)
    }

    .seg.now {
      background: var(--ink)
    }

    /* question */
    .stage {
      flex: 1
    }

    .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px
    }

    h1 {
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(22px, 5.4vw, 30px);
      line-height: 1.15;
      letter-spacing: -.025em;
      margin-bottom: 8px
    }

    .helper {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 20px;
      line-height: 1.5
    }

    .opts {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .opt {
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 2px;
      padding: 15px 16px;
      font: inherit;
      font-size: 15px;
      line-height: 1.35;
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 13px;
      transition: border-color .12s, background .12s
    }

    .opt:hover {
      border-color: var(--ink)
    }

    .opt:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px
    }

    .box {
      flex: none;
      width: 15px;
      height: 15px;
      border: 1.5px solid var(--rule);
      border-radius: 1px;
      position: relative
    }

    .opt[aria-pressed="true"] {
      border-color: var(--accent);
      background: #fff
    }

    .opt[aria-pressed="true"] .box {
      border-color: var(--accent);
      background: var(--accent)
    }

    .opt[aria-pressed="true"] .box::after {
      content: "";
      position: absolute;
      inset: 2px 3px;
      border: solid #fff;
      border-width: 0 0 1.6px 1.6px;
      transform: rotate(-45deg);
      height: 5px
    }

    /* nav */
    .nav {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 22px 0 12px
    }

    .btn {
      font-family: var(--display);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -.01em;
      padding: 13px 22px;
      border: 1px solid var(--ink);
      border-radius: 2px;
      background: var(--ink);
      color: var(--paper);
      cursor: pointer
    }

    .btn:disabled {
      opacity: .28;
      cursor: not-allowed
    }

    .btn.ghost {
      background: none;
      color: var(--ink);
      border-color: var(--rule)
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px
    }

    /* signal meter — the live read-out */
    .meter {
      border-top: 1px solid var(--rule);
      background: var(--paper);
      position: sticky;
      bottom: 0;
      padding: 11px 0 15px
    }

    .meter-hd {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .12em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px
    }

    .bars {
      display: flex;
      gap: 5px
    }

    .bar {
      flex: 1
    }

    .bar-track {
      height: 4px;
      background: var(--rule);
      overflow: hidden
    }

    .bar-fill {
      height: 100%;
      width: 0;
      background: var(--signal);
      transition: width .45s cubic-bezier(.2, .7, .3, 1)
    }

    .bar-fill.lead {
      background: var(--accent)
    }

    .bar-lbl {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .06em;
      color: var(--muted);
      margin-top: 5px
    }

    /* results */
    .verdict {
      border: 1px solid var(--ink);
      background: #fff;
      padding: 22px 20px;
      margin-bottom: 12px
    }

    .verdict .eyebrow {
      color: var(--accent)
    }

    .verdict h2 {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(21px, 5vw, 27px);
      line-height: 1.15;
      letter-spacing: -.03em;
      margin-bottom: 12px
    }

    .reasons {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--rule)
    }

    .reasons li {
      font-size: 14px;
      line-height: 1.45;
      padding-left: 16px;
      position: relative;
      color: #2C3038
    }

    .reasons li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 8px;
      width: 6px;
      height: 6px;
      background: var(--signal)
    }

    .addon {
      border: 1px solid var(--rule);
      background: var(--card);
      padding: 17px 18px;
      margin-bottom: 12px
    }

    .addon h3 {
      font-family: var(--display);
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 5px;
      letter-spacing: -.01em
    }

    .addon p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5
    }

    .roi {
      display: flex;
      align-items: baseline;
      gap: 12px;
      border: 1px solid var(--rule);
      background: var(--card);
      padding: 17px 18px;
      margin-bottom: 22px
    }

    .roi b {
      font-family: var(--display);
      font-weight: 800;
      font-size: 34px;
      letter-spacing: -.04em;
      color: var(--accent);
      line-height: 1
    }

    .roi span {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4
    }

    /* capture */
    .field {
      margin-bottom: 13px
    }

    label {
      display: block;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px
    }

    input,
    select {
      width: 100%;
      font: inherit;
      font-size: 15px;
      padding: 13px 14px;
      border: 1px solid var(--rule);
      border-radius: 2px;
      background: #fff;
      color: var(--ink)
    }

    input:focus,
    select:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
      border-color: var(--accent)
    }

    .status {
      font-size: 13px;
      color: var(--muted);
      margin-top: 12px;
      line-height: 1.5
    }

    .status.bad {
      color: #A32020
    }

    .nav.results {
      flex-wrap: wrap
    }

    .softexit {
      flex-basis: 100%;
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted)
    }

    .softexit a {
      color: var(--muted);
      text-underline-offset: 2px
    }

    .softexit a:hover {
      color: var(--ink)
    }

    .foot {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      padding: 16px 0 22px;
      letter-spacing: .05em
    }

    .fade {
      animation: in .3s ease both
    }

    @keyframes in {
      from {
        opacity: 0;
        transform: translateY(7px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .fade {
        animation: none
      }

      .bar-fill {
        transition: none
      }
    }
  </style>
</head>

        { t: "POS or card terminal", w: {money:2,report:2} },
        { t: "We already send payment links", w: {report:2} },
        { t: "We invoice and wait, then follow up", w: {money:9}, n: "Invoice-and-wait is where cash quietly gets stuck; automated follow-up fixes it." }]
      },
      {
        id: "visibility", q: "How do you find out how the business performed last week?", h: "",
        o: [{ t: "I open each platform and work it out myself", w: {report:10}, n: "Pulling numbers from several places by hand is a report waiting to be automated." },
        { t: "Someone prepares a report for me", w: {report:8}, n: "A person assembling your weekly numbers is doing work a system should do." },
        { t: "Honestly, we don't really track it", w: {report:6,onboard:1}, n: "Without regular numbers you find out how a month went only after it's over." },
        { t: "A dashboard already shows me", w: {} }]
      },
      {
        id: "hiring", q: "How often are you hiring?", h: "You mentioned applications eat your time.",
        when: () => (answers.tasks || []).some(o => o.w.hiring),
        o: [{ t: "Constantly, there is usually a role open", w: {hiring:14}, n: "With a role almost always open, screening is a permanent cost rather than an occasional one." },
        { t: "Several times a year", w: {hiring:8}, n: "Hiring often enough that screening repeats is hiring often enough to automate it." },
        { t: "Once in a while", w: {hiring:3} },
        { t: "Rarely, it is mostly just us", w: {} }]
      },
      {
        id: "hours", q: "How many hours a week go into your single most repetitive task?", h: "Across everyone who touches it.",
        o: [{ t: "1 to 5 hours", w: {}, hrs: 3 },
        { t: "6 to 15 hours", w: {onboard:1}, hrs: 10 },
        { t: "16 to 30 hours", w: {onboard:3}, hrs: 23 },
        { t: "More than 30 hours", w: {onboard:4}, hrs: 35 }]
      }
    ];

    /* ---------------- state ---------------- */
    const params = new URLSearchParams(location.search);
    const SOURCE = (params.get("src") || params.get("utm_source") || "direct").slice(0, 40);
    const answers = {};
    let captured = null, emailState = null;
    let industry = null, step = -1;
    /* Some questions only apply to some businesses, so the length is computed live. */
    function activeQs() { return QUESTIONS.filter(q => !q.when || q.when()); }
    function total() { return 2 + activeQs().length; }

    const stage = document.getElementById("stage");
    const nav = document.getElementById("nav");
    const prog = document.getElementById("prog");
    const meter = document.getElementById("meter");
    const bars = document.getElementById("bars");
    const count = document.getElementById("count");

    bars.innerHTML = ORDER.map(k =>
      `<div class="bar"><div class="bar-track"><div class="bar-fill" id="f-${k}"></div></div>
   <div class="bar-lbl">${LINES[k].code}</div></div>`).join("");

    function drawSegs() { prog.innerHTML = Array.from({ length: total() }, (_, i) => `<div class="seg" id="s${i}"></div>`).join(""); }
    drawSegs();

    function scores() {
      const s = Object.fromEntries(ORDER.map(k => [k, 0]));
      const add = w => { for (const k in w) s[k] += w[k]; };
      if (industry) add(INDUSTRIES[industry].prior);
      if (answers.tasks) answers.tasks.forEach(o => add(o.w));
      activeQs().forEach(q => { if (answers[q.id]) add(answers[q.id].w); });
      return s;
    }
    function drawMeter() {
      const s = scores();
      const max = Math.max(1, ...ORDER.map(k => s[k]));
      const lead = ORDER.reduce((a, b) => s[b] > s[a] ? b : a);
      ORDER.forEach(k => {
        const f = document.getElementById("f-" + k);
        f.style.width = Math.round(s[k] / max * 100) + "%";
        f.classList.toggle("lead", k === lead && s[k] > 0);
      });
    }
    function drawProg() {
      const T = total();
      if (prog.children.length !== T) drawSegs();
      for (let i = 0; i < T; i++) {
        const el = document.getElementById("s" + i);
        el.className = "seg" + (i < step ? " done" : i === step ? " now" : "");
      }
      count.textContent = step >= 0 && step < T ? `${step + 1} / ${T}` : "";
    }

    /* ---------------- rendering ---------------- */
    function render() {
      drawProg(); drawMeter();
      meter.hidden = step < 1;
      stage.className = "stage fade";
      void stage.offsetWidth;

      if (step === -1) return intro();
      if (step === 0) return industryQ();
      if (step === 1) return tasksQ();
      if (step <= total() - 1) return plainQ(activeQs()[step - 2]);
      if (step === total()) return gate();
      return results();
    }

    function intro() {
      stage.innerHTML = `
    <div class="eyebrow">Automation diagnostic</div>
    <h1>A dozen questions about how your business actually spends its week.</h1>
    <p class="helper">No sales pitch first. Answer honestly and you'll see which one automation would give you the most time back, and roughly how much. Under four minutes.</p>`;
      nav.innerHTML = `<button class="btn" id="go">Start</button>`;
      go.onclick = () => { step = 0; render(); };
    }

    function industryQ() {
      stage.innerHTML = `
    <div class="eyebrow">Question 1</div>
    <h1>What kind of business is it?</h1>
    <p class="helper">This changes the questions you get, not the outcome.</p>
    <div class="opts">${Object.entries(INDUSTRIES).map(([k, v]) =>
        `<button class="opt" data-k="${k}" aria-pressed="${industry === k}"><span class="box"></span>${v.label}</button>`).join("")}</div>`;
      stage.querySelectorAll(".opt").forEach(b => b.onclick = () => {
        if (industry !== b.dataset.k) { industry = b.dataset.k; answers.tasks = null; }
        advance();
      });
      nav.innerHTML = "";
    }

    function tasksQ() {
      const list = TASKS[industry];
      const sel = answers.tasks || [];
      stage.innerHTML = `
    <div class="eyebrow">Question 2</div>
    <h1>Which of these eat the most repeated hours each week?</h1>
    <p class="helper">Choose up to three. This is the answer that carries the most weight.</p>
    <div class="opts">${list.map((o, i) =>
        `<button class="opt" data-i="${i}" aria-pressed="${sel.includes(o)}"><span class="box"></span>${o.t}</button>`).join("")}</div>`;
      stage.querySelectorAll(".opt").forEach(b => b.onclick = () => {
        const o = list[+b.dataset.i];
        let cur = answers.tasks || [];
        if (cur.includes(o)) cur = cur.filter(x => x !== o);
        else if (cur.length < 3) cur = [...cur, o];
        answers.tasks = cur;
        b.setAttribute("aria-pressed", cur.includes(o));
        drawMeter(); navButtons();
      });
      navButtons();
    }

    function plainQ(q) {
      stage.innerHTML = `
    <div class="eyebrow">Question ${step + 1}</div>
    <h1>${q.q}</h1>
    ${q.h ? `<p class="helper">${q.h}</p>` : `<div style="height:14px"></div>`}
    <div class="opts">${q.o.map((o, i) =>
        `<button class="opt" data-i="${i}" aria-pressed="${answers[q.id] === o}"><span class="box"></span>${o.t}</button>`).join("")}</div>`;
      stage.querySelectorAll(".opt").forEach(b => b.onclick = () => {
        answers[q.id] = q.o[+b.dataset.i];
        b.setAttribute("aria-pressed", "true");
        advance();
      });
      navButtons();
    }

    function navButtons() {
      const ready = step === 1 ? (answers.tasks || []).length > 0 : true;
      nav.innerHTML = `<button class="btn ghost" id="back">Back</button>
    ${step === 1 ? `<button class="btn" id="next" ${ready ? "" : "disabled"}>Continue</button>` : ""}`;
      back.onclick = () => { step--; render(); };
      if (step === 1) next.onclick = () => { step++; render(); };
    }

    function advance() {
      drawMeter();
      const wait = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 180;
      setTimeout(() => { step++; render(); }, wait);
    }

    /* ---------------- results ---------------- */
    function verdict() {
      const s = scores();
      const rank = ORDER.slice().sort((a, b) => s[b] - s[a]);
      const win = rank[0], second = rank[1];

      // Explain the winner using the answers that actually pushed it up.
      const picks = [answers.tasks || [], activeQs().map(q => answers[q.id]).filter(Boolean)].flat();
      const reasons = picks
        .filter(o => o.n && o.w && o.w[win])
        .sort((a, b) => b.w[win] - a.w[win])
        .slice(0, 3).map(o => o.n);

      const hrs = answers.hours ? answers.hours.hrs : 0;
      const monthly = Math.round(hrs * 4.33 * 0.6 / 5) * 5;
      return { s, win, second, reasons, monthly };
    }

    function gate() {
      const v = verdict();
      meter.hidden = false; drawMeter();
      count.textContent = "Result ready";
      prog.querySelectorAll(".seg").forEach(el => el.className = "seg done");

      stage.innerHTML = `
    <div class="eyebrow">All answered</div>
    <h1>Your result is ready.</h1>
    <p class="helper">You've been matched to one primary system, one add-on worth doing next, and an estimate of the hours it could give back each month. Enter your details and it appears on the next screen. A copy goes to your inbox at the same time.</p>
    <div class="field"><label for="nm">Your name</label><input id="nm" autocomplete="name"></div>
    <div class="field"><label for="bz">Business name</label><input id="bz" autocomplete="organization"></div>
    <div class="field"><label for="em">Email</label><input id="em" type="email" inputmode="email" autocomplete="email"></div>
    <div class="field"><label for="wa">WhatsApp number</label><input id="wa" inputmode="tel" autocomplete="tel"></div>
    <div class="field"><label for="tl">When would you want this running?</label>
      <select id="tl"><option>Within a month</option><option>One to three months</option><option>Just exploring for now</option></select></div>
    <div class="status" id="st"></div>`;

      nav.innerHTML = `<button class="btn ghost" id="back">Back</button><button class="btn" id="send">Show my result</button>`;
      back.onclick = () => { step--; render(); };
      send.onclick = () => submit(v);
    }

    async function submit(v) {
      const st = document.getElementById("st");
      if (!nm.value.trim() || !em.value.trim()) {
        st.className = "status bad";
        st.textContent = "Add your name and email so your result can reach you.";
        return;
      }
      captured = {
        submitted: new Date().toISOString(),
        name: nm.value.trim(), business: bz.value.trim(),
        email: em.value.trim(), whatsapp: wa.value.trim(), timeline: tl.value,
        source: SOURCE,
        industry: INDUSTRIES[industry].label,
        recommended: LINES[v.win].name, addon: LINES[v.second].name,
        price: PRICING[v.win], addonPrice: PRICING[v.second],
        hoursBack: v.monthly, reasons: v.reasons, scores: v.s,
        tasks: (answers.tasks || []).map(o => o.t),
        answers: Object.fromEntries(QUESTIONS.map(q => [q.id, answers[q.id]?.t || ""]))  // full set, blanks for skipped
      };

      send.disabled = true;
      st.className = "status"; st.textContent = "One moment\u2026";

      // Show the result regardless of what the network does. They earned it.
      const deliver = WEBHOOK_URL
        ? fetch(WEBHOOK_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(captured) })
          .then(() => true).catch(err => { console.error("Diagnostic delivery failed:", err); return false; })
        : Promise.resolve(null);

      step++; render();
      emailState = await deliver;
      const note = document.getElementById("mailnote");
      if (note) {
        if (emailState === true) note.innerHTML = "Sent to <b>" + captured.email + "</b>. If it is not there in a minute, check your spam folder, and marking it not spam means the proposal reaches you too.";
        else if (emailState === false) note.innerHTML = "Your result is above, but the email copy didn't send. Message <b>" + CONTACT + "</b> and I'll send it across.";
        else { note.textContent = "Delivery isn't configured yet, so nothing was sent."; console.log(captured); }
      }
    }

    function results() {
      const v = verdict();
      meter.hidden = false; drawMeter();
      count.textContent = "Result";

      stage.innerHTML = `
    <div class="verdict">
      <div class="eyebrow">Start here</div>
      <h2>${LINES[v.win].name}</h2>
      <p class="helper" style="margin:0">${LINES[v.win].pitch}</p>
      ${v.reasons.length ? `<ul class="reasons">${v.reasons.map(r => `<li>${r}</li>`).join("")}</ul>` : ""}
    </div>
    <div class="addon">
      <h3>Then add: ${LINES[v.second].name}</h3>
      <p>${LINES[v.second].pitch}</p>
    </div>
    ${v.monthly ? `<div class="roi"><b>~${v.monthly}</b><span>hours a month this could give back, based on the time you reported. Conservative, since it assumes only part of the work is automatable. Worth comparing against what those hours cost you in wages.</span></div>` : ""}
    <p class="status" id="mailnote">Sending your copy\u2026</p>
    <h1 style="font-size:20px;margin:22px 0 6px">Want this costed?</h1>
    <p class="helper">I'll put together a plan for your business: what gets built, how long it takes, and what it costs.</p>`;

      nav.className = "nav results";
      nav.innerHTML = (BOOK_LINK
        ? `<a class="btn" href="${BOOK_LINK}" target="_blank" rel="noopener">Book a free 30-minute call</a>`
        : "") + `<p class="softexit">Need a system built from scratch instead? <a href="https://cleverlon.com/software">See our custom software services.</a></p>`;
    }

    render();
  </script>
</body>

</html>
